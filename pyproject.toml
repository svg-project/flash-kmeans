[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "flash-kmeans"
version = "0.4.0"
description = "Fast batched K-Means clustering with C++/CUDA kernels (nanobind)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Shuo Yang", email = "andy_yang@berkeley.edu" }
]
license = { file = "LICENSE.txt" }
keywords = ["kmeans", "gpu", "cuda", "cpp", "clustering", "pytorch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Programming Language :: CUDA",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0",
  "numpy",
]

[project.urls]
Homepage = "https://github.com/svg-project/flash-kmeans"
BugTracker = "https://github.com/svg-project/flash-kmeans/issues"
Source = "https://github.com/svg-project/flash-kmeans"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["flash_kmeans"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
markers = [
  "perf: performance regression tests (set FLASH_KMEANS_PERF=1 to run)",
]
